<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WPH Room Status</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{
  --bg:#f3f5f8;--card:#fff;--ink:#14213d;--muted:#5b6475;--line:#e3e7ee;--brand:#1f3a5f;--brand2:#2c5282;
  --green:#1e8e3e;--green-bg:#e6f4ea;--dgreen:#1b6e32;--lgreen:#bfeccb;--dgreen-t:#145226;--amber:#b06000;--amber-bg:#fef3e0;--red:#c5221f;--red-bg:#fce8e6;
  --blue:#1a5fb4;--blue-bg:#e8f0fe;--grey:#5f6368;--grey-bg:#eef0f3;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1520;--card:#182131;--ink:#e8edf5;--muted:#9aa5b8;--line:#263247;--brand:#24446e;--brand2:#2f5a8f;
  --green:#7bd88f;--green-bg:#173823;--dgreen:#2e8b4a;--lgreen:#2a5a37;--dgreen-t:#c9f2d4;--amber:#f5b85c;--amber-bg:#3a2a12;--red:#f28b82;--red-bg:#3c1a19;
  --blue:#8ab4f8;--blue-bg:#16294a;--grey:#b7bdc8;--grey-bg:#232d3d;}}
:root[data-theme="dark"]{--bg:#0f1520;--card:#182131;--ink:#e8edf5;--muted:#9aa5b8;--line:#263247;--brand:#24446e;--brand2:#2f5a8f;
  --green:#7bd88f;--green-bg:#173823;--dgreen:#2e8b4a;--lgreen:#2a5a37;--dgreen-t:#c9f2d4;--amber:#f5b85c;--amber-bg:#3a2a12;--red:#f28b82;--red-bg:#3c1a19;--blue:#8ab4f8;--blue-bg:#16294a;--grey:#b7bdc8;--grey-bg:#232d3d;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
header{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;padding:18px 16px 22px}
header .proj{font-size:12px;opacity:.85;letter-spacing:.04em;text-transform:uppercase}
header h1{margin:6px 0 2px;font-size:30px;letter-spacing:.02em}
header .sub{font-size:15px;opacity:.95}
header .loc{font-size:15px;font-weight:600;margin-top:4px;opacity:.95}header .loc:empty{display:none}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tag{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:3px 10px;font-size:13px}
main{max-width:640px;margin:-12px auto 0;padding:0 12px 28px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:12px 0;overflow:hidden}
.card h2{margin:0;padding:12px 14px;font-size:14px;letter-spacing:.04em;text-transform:uppercase;color:#fff;background:linear-gradient(135deg,var(--brand),var(--brand2));border-bottom:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.k{color:var(--muted);flex:1 1 auto;min-width:0}
.v{font-weight:600;text-align:right;flex:0 1 auto;max-width:62%;overflow-wrap:anywhere}
.chip{display:inline-block;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600;white-space:nowrap}
.c-green{color:var(--t-approved,#fff);background:var(--k-approved,#00B050)}.c-lgreen{color:var(--t-coordinated,#123d1d);background:var(--k-coordinated,#B5E6A2)}.c-amber{color:var(--t-review,#000);background:var(--k-review,#FFC000)}
.c-red{color:var(--t-revise,#fff);background:var(--k-revise,#FF0000)}.c-blue{color:var(--blue);background:var(--blue-bg)}.c-grey{color:var(--t-pending,#000);background:var(--k-pending,#BFBFBF)}.c-plain{color:var(--grey);background:var(--grey-bg)}
.empty{color:var(--muted);font-weight:400;font-style:italic}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line)}
.stat{background:var(--card);padding:12px 14px}
.stat b{display:block;font-size:24px}
.stat span{color:var(--muted);font-size:12.5px}
.bar{height:6px;background:var(--grey-bg);border-radius:4px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand2)}
.summary{display:flex;gap:8px;padding:10px 14px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
footer{color:var(--muted);font-size:12px;text-align:center;padding:4px 16px 24px}
.msg{padding:28px 16px;text-align:center;color:var(--muted)}
input[type=search]{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font-size:16px}
.list a{display:flex;justify-content:space-between;padding:10px 14px;border-top:1px solid var(--line);color:var(--ink);text-decoration:none}
.list a span{color:var(--muted)}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--brand2);border-radius:50%;animation:s 1s linear infinite;margin:0 auto 10px}
@keyframes s{to{transform:rotate(360deg)}}
.sbar{display:flex;height:8px;border-radius:5px;overflow:hidden;background:var(--grey-bg);margin:6px 0 2px}
.sbar i{display:block}.b-green{background:var(--k-approved,#00B050)}.b-lgreen{background:var(--k-coordinated,#B5E6A2)}.b-amber{background:var(--k-review,#FFC000)}.b-red{background:var(--k-revise,#FF0000)}.b-grey{background:var(--k-pending,#BFBFBF)}.b-blue{background:var(--blue)}.b-none{background:var(--line)}
.row.col{display:block}.rowtop{display:flex;justify-content:space-between;gap:12px}
.legend{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}.legend .chip{font-size:11.5px;padding:1px 8px}
.pct{color:var(--muted);font-weight:500;font-size:13px;margin-left:4px}
.thead{background:var(--grey-bg);font-size:12px;text-transform:uppercase;letter-spacing:.03em;padding-top:6px;padding-bottom:6px}
.thead .k,.thead .v{color:var(--muted);font-weight:600}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-left:6px;vertical-align:middle;background:var(--line)}
.d-green{background:var(--k-approved,#00B050)}.d-lgreen{background:var(--k-coordinated,#B5E6A2)}.d-amber{background:var(--k-review,#FFC000)}.d-red{background:var(--k-revise,#FF0000)}.d-grey{background:var(--k-pending,#BFBFBF)}.d-blue{background:var(--blue)}
.list a b span{color:var(--muted);font-weight:500;margin-left:6px}
.rev{color:var(--muted);font-size:12.5px;font-weight:500;margin-right:8px;white-space:nowrap}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;padding:0 8px;border-radius:15px;color:#fff;font-weight:800;font-size:13px;letter-spacing:.02em;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.sk-yes{color:#00873A;font-weight:800}.sk-no{color:#E00000;font-weight:800}
.tally{padding:6px 14px 8px;border-bottom:1px solid var(--line)}.trow{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)}.trow:last-child{border-bottom:0}.trow .tl{flex:1;color:var(--ink)}.trow b{font-size:18px;min-width:40px;text-align:right}.ttot .tl{color:var(--muted);font-size:13px}
.row.fls{display:block}.fi{font-weight:600;color:var(--ink);margin-bottom:4px}.fline{display:flex;justify-content:space-between;align-items:center;padding:3px 0 3px 12px}.fl{color:var(--muted);font-size:13.5px}.fv{display:flex;align-items:center}
.card>h2{cursor:pointer;display:flex;justify-content:space-between;align-items:center;user-select:none;-webkit-tap-highlight-color:transparent}.card>h2 .sign{font-size:22px;font-weight:700;line-height:1;margin-left:12px}.card.closed>.cbody{display:none}
</style>
</head>
<body>
<header id="hdr"><div class="proj" id="proj">Qiddiya Water Park Hotel</div><div class="loc" id="loc"></div><h1 id="title">Room status</h1><div class="sub" id="sub"></div><div class="tags" id="tags"></div></header>
<main id="app"><div class="card msg"><div class="spin"></div>Loading latest data…</div></main>
<footer id="foot"></footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* ====== SETTINGS ======
   DATA_URL: the Excel register. Keep it next to this page (same folder) and keep the file name. */
const DATA_URL = "WPH_Room_Register.xlsx";
/* ====================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmtDate(v){
  if(v===null||v===undefined||v==="")return "";
  let d=v instanceof Date?v:(typeof v==="number"?new Date(Math.round((v-25569)*864e5)):new Date(v));
  if(isNaN(d))return String(v);
  d=new Date(d.getTime()+432e5);
  return String(d.getUTCDate()).padStart(2,"0")+"-"+MON[d.getUTCMonth()]+"-"+d.getUTCFullYear();
}
const blank=v=>v===null||v===undefined||String(v).trim()==="";
function sheet(wb,name){const ws=wb.Sheets[name];return ws?XLSX.utils.sheet_to_json(ws,{defval:"",raw:true}):[]}

const META=[],SETV={};
async function load(){
  const res=await fetch(DATA_URL+"?t="+Date.now(),{cache:"no-store"});
  if(!res.ok)throw new Error("Could not load the register ("+res.status+")");
  const buf=await res.arrayBuffer();
  const wb=XLSX.read(buf,{type:"array",cellDates:true});
  const cfg={};sheet(wb,"Config").forEach(r=>{if(r.Key)cfg[String(r.Key).trim()]=r.Value});
  const colours={};
  sheet(wb,"Lists").forEach(r=>{
    if(!blank(r.Status)){const k=String(r.Status).trim(), cat=String(r["Counts as"]||"").trim().toLowerCase(), hex=String(r.Colour||"").trim();
      const key={approved:"green",coordinated:"lgreen",review:"amber",revise:"red",pending:"grey"}[cat]||(/^#/.test(hex)?"grey":hex.toLowerCase()||"grey");
      colours[k.toLowerCase()]=key; META.push({code:k,meaning:String(r.Meaning||""),key,hex});
      if(/^#[0-9a-f]{6}$/i.test(hex)&&cat&&!SETV[cat]){SETV[cat]=1;const h=hex.slice(1),L=(0.299*parseInt(h.slice(0,2),16)+0.587*parseInt(h.slice(2,4),16)+0.114*parseInt(h.slice(4,6),16))/255;
        document.documentElement.style.setProperty("--k-"+cat,hex);document.documentElement.style.setProperty("--t-"+cat,L>0.6?"#111":"#fff");}}
    if(!blank(r.Clearance))colours[String(r.Clearance).trim().toLowerCase()]=String(r.Colour_1||r["Colour_1"]||"grey").toLowerCase();
  });
  const pick=(...n)=>{for(const x of n){if(wb.Sheets[x])return sheet(wb,x)}return []};
  return {cfg,colours,rooms:pick("Clearances","Rooms"),types:pick("Shop Drawings","Types"),fields:sheet(wb,"Fields"),fls:sheet(wb,"FLS")};
}

function chip(v,colours){
  if(blank(v))return '<span class="empty">Not updated</span>';
  let c=colours[String(v).trim().toLowerCase()];
  if(!c){const s=String(v).trim().toUpperCase();
    c=/^(A|B)\b/.test(s)||/APPROV|PROVIDED|COMPLETE/.test(s)?"green":/^UR$|REVIEW|PARTIAL/.test(s)?"amber":/^C\b|^D\b|REJECT|PENDING|REVISE/.test(s)?"red":"grey";}
  if(!["green","lgreen","amber","red","blue","grey"].includes(c))c="grey";
  return `<span class="chip c-${c}">${esc(v)}</span>`;
}

const SKETCH="Coordination Sketch";
const isSD=col=>/^(MEP|ELV) SD - /.test(col)||col==="ID SD Status";
const revCol=col=>col==="ID SD Status"?"ID SD Revision":col+" Rev";
const sketchOn=rec=>/^\s*provided/i.test(String(rec[SKETCH]||""));
// effective status: official approval (dark green) > coordination sketch (light green) > official status
function eff(rec,col,colours){
  const v=rec[col];
  if(col===SKETCH){return blank(v)?{k:"none",t:""}:{k:sketchOn(rec)?"lgreen":"plain",t:String(v)};}
  const c=colourOf(v,colours);
  return {k:c,t:blank(v)?"":String(v)};
}
const FALLBACK={A:"#00B050",B:"#00B050",UR:"#FFC000",C:"#FF0000",TBS:"#BFBFBF"};
function codeHex(v){const k=String(v).trim().toUpperCase();const m=META.find(x=>x.code.toUpperCase()===k&&/^#/.test(x.hex));return m?m.hex:FALLBACK[k];}
function badge(v){const k=String(v).trim().toUpperCase(),h=codeHex(k);return h?`<span class="badge" style="background:${h}">${esc(k)}</span>`:null;}
function effChip(e){if(e.k!=="none"){const b=badge(e.t);if(b)return b;}return e.k==="none"?'<span class="empty">Not updated</span>':`<span class="chip c-${e.k}">${esc(e.t)}</span>`;}
const legend=()=>'<div class="legend" style="padding:8px 14px;border-bottom:1px solid var(--line);gap:8px 12px;align-items:center">'+META.filter(m=>m.code!=="Coordinated").map(m=>`<span style="display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)">${badge(m.code)||esc(m.code)}${esc(m.meaning.replace(/^Code C - /,""))}</span>`).join("")+'</div>';

function collapsible(){
  document.querySelectorAll("#app .card").forEach(card=>{
    const h=card.querySelector(":scope > h2"); if(!h||card.dataset.col)return; card.dataset.col="1";
    const body=document.createElement("div"); body.className="cbody";
    while(h.nextSibling)body.appendChild(h.nextSibling);
    card.appendChild(body); card.classList.add("closed");
    const sg=document.createElement("span"); sg.className="sign"; sg.textContent="+"; h.appendChild(sg);
    h.setAttribute("role","button"); h.tabIndex=0;
    const t=()=>{const c=card.classList.toggle("closed");sg.textContent=c?"+":"−";};
    h.addEventListener("click",t); h.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();t();}});
  });
}
function flsCard(D,code,over){
  const base=(D.fls||[]).find(r=>String(r["Level Code"]||"").trim().toUpperCase()===code)||{};
  const row=Object.assign({},base);Object.keys(over||{}).forEach(k=>{if(/^(Civil|MEP) - /.test(k)&&!blank(over[k]))row[k]=over[k]});
  const groups=[["Civil",["Steel Doors","Wooden Doors","Fire Sealant","Hardware"]],["MEP",["Fire Sealant","Fire Alarm","Fire Fighting"]]];
  Object.keys(row).filter(k=>/^(Civil|MEP) - /.test(k)&&!/ Date$/.test(k)).forEach(k=>{const p=k.split(" - ");const g=p[0],it=p[1];const G=groups.find(x=>x[0]===g);if(G&&it&&!G[1].includes(it))G[1].push(it)});
  const st=(key)=>{const v=row[key],d=row[key+" Date"];const b=blank(v)?'<span class="empty">Not updated</span>':(badge(v)||`<span class="chip c-plain">${esc(v)}</span>`);return `${blank(d)?"":`<span class="rev">${esc(fmtDate(d))}</span>`}${b}`;};
  const item=(g,it)=>`<div class="row fls"><div class="k fi">${esc(it)}</div><div class="fsub">`+[["Material","Material"],["Shop Drawing","Shop drawing"]].map(([k,l])=>`<div class="fline"><span class="fl">${l}</span><span class="fv">${st(g+" - "+it+" - "+k)}</span></div>`).join("")+`</div></div>`;
  return `<section class="card"><h2>FLS – Fire Life &amp; Safety</h2>`+groups.map(([g,its])=>`<div class="row thead"><div class="k">${g}</div><div class="v">Status</div></div>`+its.map(it=>item(g,it)).join("")).join("")+`</section>`;
}
function render(D,id){
  const {cfg,colours,rooms,types,fields}=D;
  const room=rooms.find(r=>String(r["QR ID"]).trim().toUpperCase()===id.toUpperCase());
  $("#proj").textContent=cfg["Project"]||"Qiddiya Water Park Hotel";
  if(!room){$("#title").textContent=id;$("#app").innerHTML='<div class="card msg">This room ID is not in the register.</div>';return;}
  const typ=types.find(t=>String(t["Room Type"]).trim()===String(room["Room Type"]).trim())||{};
  // merge: room value wins over type value
  const rec=Object.assign({},typ);Object.keys(room).forEach(k=>{if(!blank(room[k])||!(k in rec))rec[k]=room[k]});
  // computed quantities
  const tower=room.Tower, type=room["Room Type"];
  const inTower=rooms.filter(r=>r.Tower===tower), sameT=inTower.filter(r=>r["Room Type"]===type), sameAll=rooms.filter(r=>r["Room Type"]===type);
  const pct=(a,b)=>b?(a/b*100).toFixed(1)+"%":"–";
  rec._TypeCountTower=`${sameT.length} of ${inTower.length}`; rec._TypePctTower=pct(sameT.length,inTower.length);
  rec._TypeCountAll=`${sameAll.length} of ${rooms.length}`; rec._TypePctAll=pct(sameAll.length,rooms.length);

  $("#title").textContent=room["QR ID"];
  $("#loc").textContent=`${tower} · Level ${String(room.Level).replace(/^L/,"")}`;
  const cat=String(room["Room Category"]||typ["Room Category"]||"");
  $("#sub").textContent=/^(King|Queen)$/i.test(cat.trim())?"Standard room":"Non-standard room";
  $("#tags").innerHTML=`<span class="tag">Type ${esc(type)}</span><span class="tag">${esc(cat)}</span>${(()=>{const t=room["Design Room Tag"]??room["Room Tag"];return blank(t)?"":`<span class="tag">Design room tag ${esc(t)}</span>`})()}`;
  document.title=room["QR ID"]+" – WPH Room Status";

  // build field list: Fields sheet + any unlisted columns
  const F=fields.filter(f=>!blank(f.Column)).map(f=>({col:String(f.Column).trim(),label:String(f.Label||f.Column),section:String(f.Section||"Other information"),order:Number(f.Order)||999,show:String(f.Show||"Y").toUpperCase()!=="N",fmt:String(f.Format||"text").toLowerCase()}));
  const listed=new Set(F.map(f=>f.col));
  Object.keys(rec).forEach(k=>{if(!listed.has(k)&&!k.startsWith("__")&&k!=="Room Type"&&!/^(Civil|MEP) - /.test(k)){F.push({col:k,label:k,section:"Other information",order:1000,show:true,fmt:/date/i.test(k)?"date":/status|clearance/i.test(k)?"status":"text"});}});
  F.sort((a,b)=>a.order-b.order);
  const sections=[];F.filter(f=>f.show).forEach(f=>{let s=sections.find(x=>x.name===f.section);if(!s)sections.push(s={name:f.section,items:[]});s.items.push(f)});

  let html="";
  const lvCode=String(tower).slice(-1)+String(room.Level).toUpperCase();let flsDone=false;
  for(const s of sections){
    if(/^room$/i.test(s.name.trim()))continue;
    if(!flsDone&&/notes/i.test(s.name)){html+=flsCard(D,lvCode,room);flsDone=true;}
    if(s.name==="Room type quantity"){
      html+=`<section class="card"><h2>Room type ${esc(type)} – quantity</h2><div class="stats">
        <div class="stat"><span>In ${esc(tower)}</span><b>${sameT.length}</b><span>of ${inTower.length} rooms</span></div>
        <div class="stat"><span>Share of ${esc(tower)}</span><b>${pct(sameT.length,inTower.length)}</b><div class="bar"><i style="width:${inTower.length?sameT.length/inTower.length*100:0}%"></i></div></div>
        <div class="stat"><span>Towers A &amp; B</span><b>${sameAll.length}</b><span>of ${rooms.length} rooms</span></div>
        <div class="stat"><span>Share of all rooms</span><b>${pct(sameAll.length,rooms.length)}</b><div class="bar"><i style="width:${rooms.length?sameAll.length/rooms.length*100:0}%"></i></div></div>
      </div></section>`;continue;}
    let rows="";let st={};
    const names=new Set(s.items.map(x=>x.col));
    for(const f of s.items){
      if(f.fmt==="date"&&names.has(f.col.replace(/ Date$/,""))&&/ Date$/.test(f.col))continue;
      const v=rec[f.col];let out;
      if(f.fmt==="sketch"){const dt=rec[SKETCH+" Date"];out=sketchOn(rec)?`<span class="sk-yes">Provided</span>${blank(dt)?"":`<span class="rev" style="margin:0 0 0 8px">${esc(fmtDate(dt))}</span>`}`:`<span class="sk-no">Not Provided</span>`;}
      else if(f.fmt==="sd"){const e=eff(rec,f.col,colours),rv=rec[revCol(f.col)];out=`<span class="rev">${blank(rv)?"Rev –":"Rev "+esc(rv instanceof Date?fmtDate(rv):rv)}</span>${effChip(e)}`;st[e.k]=(st[e.k]||0)+1;}
      else if(f.fmt==="status"){const e=eff(rec,f.col,colours);out=effChip(e);st[e.k]=(st[e.k]||0)+1;const dv=rec[f.col+" Date"];if(names.has(f.col+" Date")&&!blank(dv))out+=`<span class="rev" style="margin:0 0 0 8px">${esc(fmtDate(dv))}</span>`;}
      else if(f.fmt==="date")out=blank(v)?'<span class="empty">–</span>':esc(fmtDate(v));
      else out=blank(v)?'<span class="empty">–</span>':esc(v instanceof Date?fmtDate(v):v);
      rows+=`<div class="row"><div class="k">${esc(f.label)}</div><div class="v">${out}</div></div>`;
    }
    let sum="";
    if(s.items.filter(f=>f.fmt==="status"||f.fmt==="sd").length>2){
      const n=s.items.filter(f=>f.fmt==="status"||f.fmt==="sd").length;
      sum=`<div class="summary">${st.green?`<span class="chip c-green">${st.green}/${n} approved</span>`:""}${st.lgreen?`<span class="chip c-lgreen">${st.lgreen} coordinated</span>`:""}${st.amber?`<span class="chip c-amber">${st.amber} UR</span>`:""}${st.red?`<span class="chip c-red">${st.red} C</span>`:""}${st.grey?`<span class="chip c-grey">${st.grey} TBS</span>`:""}${st.none?`<span class="chip c-plain">${st.none} not updated</span>`:""}</div>`;
    }
    const lg=s.items.some(f=>isSD(f.col))?legend():"";
    html+=`<section class="card"><h2>${esc(s.name.replace(/^\d+[a-z]?\.\s*/i,""))}</h2>${lg}${sum}${rows}</section>`;
  }
  if(!flsDone)html+=flsCard(D,lvCode,room);
  $("#app").innerHTML=html;collapsible();
  const upd=cfg["Data last updated"];
  $("#foot").innerHTML=`${upd?"Data updated "+esc(fmtDate(upd))+" · ":""}${esc(cfg["Updated by"]||"")}<br>${esc(cfg["Footer note"]||"")}`;
}

function colourOf(v,colours){
  if(blank(v))return "none";
  let c=colours[String(v).trim().toLowerCase()];
  if(!c){const s=String(v).trim().toUpperCase();
    c=/^(A|B)\b/.test(s)||/APPROV|PROVIDED|COMPLETE/.test(s)?"green":/^UR$|REVIEW|PARTIAL/.test(s)?"amber":/^C\b|^D\b|REJECT|PENDING|REVISE/.test(s)?"red":"grey";}
  return ["green","lgreen","amber","red","blue","grey"].includes(c)?c:"grey";
}
function merged(D,room){
  const typ=D.types.find(t=>String(t["Room Type"]).trim()===String(room["Room Type"]).trim())||{};
  const rec=Object.assign({},typ);Object.keys(room).forEach(k=>{if(!blank(room[k])||!(k in rec))rec[k]=room[k]});return rec;
}
function renderLevel(D,code){
  code=code.toUpperCase();
  const tw="Tower "+code[0], lvl=code.slice(1);
  const rooms=D.rooms.filter(r=>r.Tower===tw&&String(r.Level).toUpperCase()===lvl);
  $("#proj").textContent=D.cfg["Project"]||"Qiddiya Water Park Hotel";
  $("#title").textContent=`${tw} · Level ${lvl.replace(/^L/,"")}`;
  if(!rooms.length){$("#app").innerHTML='<div class="card msg">No rooms found for this level.</div>';return;}
  const inTower=D.rooms.filter(r=>r.Tower===tw);
  $("#sub").textContent=`Level summary · ${rooms.length} rooms (${(rooms.length/inTower.length*100).toFixed(1)}% of ${tw})`;
  document.title=code+" – WPH Level Status";
  const recs=rooms.map(r=>merged(D,r)), N=recs.length;
  // status columns from Fields sheet
  const F=D.fields.filter(f=>!blank(f.Column)&&String(f.Show||"Y").toUpperCase()!=="N"&&["status","sd","sketch"].includes(String(f.Format).toLowerCase())).map(f=>({col:String(f.Column).trim(),label:(String(f.Label)==="Status"?"Interior Design (ID)":String(f.Label||f.Column)),section:String(f.Section||"Other").replace(/^\d+[a-z]?\.\s*/i,""),order:Number(f.Order)||999})).sort((a,b)=>a.order-b.order);
  const cats={};rooms.forEach(r=>{cats[r["Room Category"]]=(cats[r["Room Category"]]||0)+1});
  $("#tags").innerHTML=Object.entries(cats).map(([k,v])=>`<span class="tag">${esc(k)} ${v}</span>`).join("");
  const count=col=>{const c={green:0,lgreen:0,amber:0,red:0,blue:0,grey:0,none:0};recs.forEach(x=>c[eff(x,col,D.colours).k]++);return c};
  const bar=c=>`<div class="sbar">${["green","lgreen","amber","red","blue","grey","none"].map(k=>c[k]?`<i class="b-${k}" style="flex:${c[k]}"></i>`:"").join("")}</div>`;
  let html="";
  // headline stats
  const mep=count("MEP Clearance"), elv=count("ELV Clearance");
  html+=`<section class="card"><h2>Level overview</h2><div class="stats">
    <div class="stat"><span>Guest rooms</span><b>${N}</b><span>of ${inTower.length} in ${esc(tw)}</span></div>
    <div class="stat"><span>Room types</span><b>${new Set(rooms.map(r=>r["Room Type"])).size}</b><span>typologies on this level</span></div>
    <div class="stat"><span>MEP clearance provided</span><b>${mep.green} / ${N}</b><div class="bar"><i style="width:${mep.green/N*100}%"></i></div></div>
    <div class="stat"><span>ELV clearance provided</span><b>${elv.green} / ${N}</b><div class="bar"><i style="width:${elv.green/N*100}%"></i></div></div>
  </div></section>`;
  // per-section status tables
  const secs=[];F.forEach(f=>{let s=secs.find(x=>x.name===f.section);if(!s)secs.push(s={name:f.section,items:[]});s.items.push(f)});
  for(const s of secs){
    let tally="";
    if(s.items.some(f=>isSD(f.col))){
      const sdc=s.items.filter(f=>isSD(f.col)).map(f=>f.col), cnt={}; let blankN=0, tot=0;
      recs.forEach(x=>sdc.forEach(col=>{tot++;const v=x[col];if(blank(v)){blankN++;return;}const k=String(v).trim().toUpperCase();cnt[k]=(cnt[k]||0)+1;}));
      const codes=META.filter(m=>m.code!=="Coordinated");
      tally='<div class="tally">'+codes.map(m=>`<div class="trow">${badge(m.code)||esc(m.code)}<span class="tl">${esc(m.meaning.replace(/^Code C - /,""))}</span><b>${cnt[m.code.toUpperCase()]||0}</b></div>`).join("")
        +(blankN?`<div class="trow"><span class="badge" style="background:var(--line);color:var(--muted)">–</span><span class="tl">Not updated</span><b>${blankN}</b></div>`:"")
        +`<div class="trow ttot"><span class="tl">Total submittals (${sdc.length} disciplines × ${N} rooms)</span><b>${tot}</b></div></div>`;
    }
    html+=`<section class="card"><h2>${esc(s.name)}</h2>${tally}<div class="row thead"><div class="k">Item</div><div class="v">Approved / provided</div></div>`;
    for(const f of s.items){const c=count(f.col);
      html+=`<div class="row col"><div class="rowtop"><div class="k">${esc(f.label)}</div><div class="v">${f.col===SKETCH?c.lgreen:c.green} / ${N} <span class="pct">${((f.col===SKETCH?c.lgreen:c.green)/N*100).toFixed(0)}%</span></div></div>${bar(c)}<div class="legend">${c.lgreen&&f.col!==SKETCH?`<span class="chip c-lgreen">${c.lgreen} coordinated</span>`:""}${c.amber?`<span class="chip c-amber">${c.amber} UR</span>`:""}${c.red?`<span class="chip c-red">${c.red} C</span>`:""}${c.grey?`<span class="chip c-grey">${c.grey} TBS</span>`:""}${c.none?`<span class="chip c-plain">${c.none} not updated</span>`:""}</div></div>`;}
    html+=`</section>`;
  }
  // room types on this level
  const types={};rooms.forEach(r=>{types[r["Room Type"]]=(types[r["Room Type"]]||0)+1});
  html+=`<section class="card"><h2>Room types on this level</h2>${Object.entries(types).sort().map(([t,n])=>`<div class="row"><div class="k">${esc(t)}</div><div class="v">${n} <span class="pct">${(n/N*100).toFixed(1)}%</span></div></div>`).join("")}</section>`;
  // room list
  const dot=v=>`<i class="dot d-${colourOf(v,D.colours)}"></i>`;
  html+=`<section class="card list"><h2>Rooms · tap for details</h2><div class="row thead"><div class="k">Room</div><div class="v">ID SD · MEP · ELV</div></div>${recs.map(x=>`<a href="?room=${encodeURIComponent(x["QR ID"])}"><b>${esc(x["QR ID"])} <span>${esc(x["Room Type"])}</span></b><span>${dot(x["ID SD Status"])}${dot(x["MEP Clearance"])}${dot(x["ELV Clearance"])}</span></a>`).join("")}</section>`;
  html+=flsCard(D,code,{});
  $("#app").innerHTML=html;collapsible();
  const upd=D.cfg["Data last updated"];
  $("#foot").innerHTML=`${upd?"Data updated "+esc(fmtDate(upd))+" · ":""}${esc(D.cfg["Updated by"]||"")}<br>${esc(D.cfg["Footer note"]||"")}`;
}

function renderIndex(D){
  $("#proj").textContent=D.cfg["Project"]||"Qiddiya Water Park Hotel";
  $("#title").textContent="Room status register";
  $("#sub").textContent=`${D.rooms.length} rooms · Towers A & B`;
  $("#app").innerHTML=`<div class="card" style="padding:12px"><input type="search" id="q" placeholder="Search room no. or type, e.g. AL02G05 or K01C"></div><div class="card list" id="list"></div>`;
  const draw=()=>{const q=$("#q").value.trim().toUpperCase();
    const L=D.rooms.filter(r=>!q||String(r["QR ID"]).toUpperCase().includes(q)||String(r["Room Type"]).toUpperCase()===q).slice(0,200);
    $("#list").innerHTML=L.map(r=>`<a href="?room=${encodeURIComponent(r["QR ID"])}"><b>${esc(r["QR ID"])}</b><span>${esc(r.Tower)} · ${esc(r.Level)} · ${esc(r["Room Type"])}</span></a>`).join("")||'<div class="msg">No match</div>';};
  $("#q").addEventListener("input",draw);draw();
}

(async()=>{
  const q=new URLSearchParams(location.search), id=q.get("room"), lv=q.get("level");
  try{const D=await load(); id?render(D,id.trim()):lv?renderLevel(D,lv.trim()):renderIndex(D);}
  catch(e){$("#app").innerHTML=`<div class="card msg">${esc(e.message)}<br>Check your connection and scan again.</div>`;}
})();
</script>
</body>
</html>
